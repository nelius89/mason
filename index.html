<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d0d2b 0%, #1a0a3c 40%, #2e1a5e 70%, #4b2080 100%);
    }

    .message {
      text-align: center;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
    }

    .message p {
      font-size: clamp(2.5rem, 6vw, 5rem);
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="message">
    <p>Hola Nelius,</p>
    <p>¿Cómo estás?</p>
  </div>
</body>
</html>
